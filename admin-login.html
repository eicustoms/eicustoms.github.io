<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ethan & Isaac Customs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: min(420px, 100%);
        }
        .login-container h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.8rem;
        }
        .login-container label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #444;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .login-container button:hover {
            background: #5a6ee0;
        }
        .login-error {
            color: #d32f2f;
            font-size: 0.95rem;
            margin-top: 10px;
        }
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 5px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="login-container">
       <a href="index.html" class="back-link">← Back to Homepage</a>
        <h1>Admin Login</h1>
        <form id="loginForm">
            <label for="passwordInput">Password</label>
            <input id="passwordInput" name="password" type="password" placeholder="Enter admin password" required>
            <button type="submit">Sign in</button>
            <div class="login-error" id="loginError"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginError.textContent = '';

            const password = document.getElementById('passwordInput').value;
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();
                if (response.ok && data.status === 'ok') {
                    window.location.href = '/admin';
                } else {
                    loginError.textContent = data.message || 'Invalid password. Please try again.';
                }
            } catch (error) {
                loginError.textContent = 'Login failed. Please try again later.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
