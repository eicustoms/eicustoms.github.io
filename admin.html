<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Ethan & Isaac Customs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container.hidden {
            display: none;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-container button:hover {
            background: #764ba2;
        }

        .login-error {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .admin-panel {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 1000px;
            width: 100%;
        }

        .admin-panel.hidden {
            display: none;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .admin-header h1 {
            color: #333;
        }

        .logout-btn {
            background: #d32f2f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        .submissions-container {
            max-height: 600px;
            overflow-y: auto;
        }

        .submission {
            background: #f5f5f5;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }

        .submission h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .submission p {
            color: #666;
            margin: 5px 0;
            font-size: 14px;
        }

        .submission .timestamp {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }

        .custom-details {
            background: white;
            padding: 10px;
            margin-top: 10px;
            border-radius: 3px;
            font-size: 13px;
            color: #555;
        }

        .no-submissions {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            padding: 40px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.in-progress {
            background: #cfe2ff;
            color: #084298;
        }

        .status-badge.completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .submission-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .status-select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: white;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-count {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <h1>Admin Login</h1>
        <div class="login-error" id="loginError"></div>
        <form id="loginForm">
            <input type="password" id="passwordInput" placeholder="Enter admin password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel hidden" id="adminPanel">
        <div class="admin-header">
            <h1>Project Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="stats" id="statsContainer">
            <div class="stat-item">
                <span class="stat-count" id="totalCount">0</span>
                <span>Total Projects</span>
            </div>
            <div class="stat-item">
                <span class="stat-count" id="pendingCount">0</span>
                <span>Pending</span>
            </div>
            <div class="stat-item">
                <span class="stat-count" id="inProgressCount">0</span>
                <span>In Progress</span>
            </div>
            <div class="stat-item">
                <span class="stat-count" id="completedCount">0</span>
                <span>Completed</span>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all" onclick="filterSubmissions('all')">All</button>
            <button class="filter-btn" data-filter="pending" onclick="filterSubmissions('pending')">Pending</button>
            <button class="filter-btn" data-filter="in-progress" onclick="filterSubmissions('in-progress')">In Progress</button>
            <button class="filter-btn" data-filter="completed" onclick="filterSubmissions('completed')">Completed</button>
        </div>

        <div class="submissions-container" id="submissionsContainer">
            <div class="loading">Loading submissions...</div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
